name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Normal runs take under two minutes; the timeouts stop a hung step (seen once in a
# Playwright install) long before the 6-hour default.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm check:docs
      - run: pnpm coverage
      - run: pnpm build
      - run: pnpm smoke
      - run: pnpm check:publish
      - run: pnpm size

  test-node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # WebKit's system libraries come with the image: installing them with `--with-deps` means
    # ~180 apt packages, which slow Azure mirrors have stretched past the timeout. Keep the tag in
    # step with the `playwright` devDependency; on a mismatch only the browser is downloaded.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install webkit
      - run: pnpm test:webkit

  # Dev tooling needs Node 22+, so older/alternative runtimes run a smoke test against the built dist.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runtime: [node20, bun, deno, workers]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - if: matrix.runtime == 'node20'
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - if: matrix.runtime == 'node20'
        run: node scripts/smoke.mjs
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
      - if: matrix.runtime == 'bun'
        run: bun scripts/smoke.mjs
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
      - if: matrix.runtime == 'deno'
        run: deno run --allow-read scripts/smoke.mjs
      - if: matrix.runtime == 'workers'
        run: pnpm smoke:workers
