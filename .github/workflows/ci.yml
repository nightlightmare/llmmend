name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Normal runs take under two minutes; the timeouts stop a hung step (seen once in a
# Playwright install) long before the 6-hour default.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      badge: ${{ steps.badge.outputs.json }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm check:docs
      - run: pnpm coverage
      - if: github.event_name == 'push'
        id: badge
        run: echo "json=$(node scripts/coverage-badge.mjs)" >> "$GITHUB_OUTPUT"
      - run: pnpm build
      - run: pnpm site:build
      - run: pnpm examples:check
      - run: pnpm smoke
      - run: pnpm check:publish
      - run: pnpm size

  test-node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # WebKit's system libraries come with the image: installing them with `--with-deps` means
    # ~180 apt packages, which slow Azure mirrors have stretched past the timeout. Keep the tag in
    # step with the `playwright` devDependency; on a mismatch only the browser is downloaded.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install webkit
      - run: pnpm test:webkit

  # Dev tooling needs Node 22+, so older/alternative runtimes run a smoke test against the built dist.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runtime: [node20, bun, deno, workers]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - if: matrix.runtime == 'node20'
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - if: matrix.runtime == 'node20'
        run: node scripts/smoke.mjs
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
      - if: matrix.runtime == 'bun'
        run: bun scripts/smoke.mjs
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
      - if: matrix.runtime == 'deno'
        run: deno run --allow-read scripts/smoke.mjs
      # The Deno example, against this build rather than the published package.
      - if: matrix.runtime == 'deno'
        working-directory: examples/deno
        run: |
          deno check --import-map=ci.imports.json main.ts check.ts
          deno run --import-map=ci.imports.json --allow-read --allow-env=GEMINI_API_KEY check.ts
      - if: matrix.runtime == 'workers'
        run: pnpm smoke:workers

  # The README coverage badge reads coverage.json from the `badges` branch through shields.io.
  # Only this job can write, and it runs no repo code: it force-pushes a one-commit branch.
  coverage-badge:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - env:
          BADGE: ${{ needs.check.outputs.badge }}
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git init -q -b badges badges
          cd badges
          printf '%s\n' "$BADGE" > coverage.json
          git add coverage.json
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "Coverage badge for $GITHUB_SHA"
          git push -qf "https://x-access-token:$TOKEN@github.com/$REPO.git" badges
