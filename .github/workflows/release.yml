name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm Trusted Publishing (OIDC) + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v2
        # v2 renamed the inputs and takes the token as an input, not from the environment.
        with:
          publish-script: pnpm release
          pr-title: Version Packages
          commit-message: Version Packages
          github-token: ${{ secrets.GITHUB_TOKEN }}
